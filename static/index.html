<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bedrock RDS Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: Inter, system-ui, sans-serif;
      background: #f5f7fb; color: #172033;
      height: 100vh; display: flex;
    }
    aside {
      width: 280px; background: #111827; color: white;
      padding: 18px; display: flex; flex-direction: column;
    }
    h1 { font-size: 18px; margin: 0 0 16px; }
    button {
      border: 0; border-radius: 9px; padding: 11px 14px;
      cursor: pointer; font-weight: 600;
    }
    #newChat { background: #fff; color: #111827; margin-bottom: 14px; }
    #conversations { overflow-y: auto; }
    .conv {
      width: 100%; text-align: left; color: #e5e7eb;
      background: transparent; margin: 3px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .conv:hover, .conv.active { background: #263244; }
    main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    header {
      height: 64px; background: white; border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; padding: 0 24px; font-weight: 700;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 28px max(20px, 8vw);
    }
    .message {
      max-width: 850px; margin: 0 auto 18px;
      display: flex; gap: 12px;
    }
    .bubble {
      padding: 13px 16px; border-radius: 14px;
      white-space: pre-wrap; line-height: 1.55;
      width: fit-content; max-width: 100%;
    }
    .user { justify-content: flex-end; }
    .user .bubble { background: #2563eb; color: white; }
    .assistant .bubble { background: white; border: 1px solid #e5e7eb; }
    form {
      background: white; border-top: 1px solid #e5e7eb;
      padding: 16px max(20px, 8vw); display: flex; gap: 10px;
    }
    textarea {
      flex: 1; resize: none; min-height: 48px; max-height: 140px;
      border: 1px solid #cbd5e1; border-radius: 12px;
      padding: 13px; font: inherit; outline: none;
    }
    textarea:focus { border-color: #2563eb; }
    #send { background: #2563eb; color: white; min-width: 80px; }
    #send:disabled { opacity: .6; cursor: wait; }
    .empty { text-align: center; color: #64748b; padding-top: 15vh; }
    @media (max-width: 700px) {
      aside { width: 210px; }
      #messages, form { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Bedrock + RDS</h1>
    <button id="newChat">+ New chat</button>
    <div id="conversations"></div>
  </aside>

  <main>
    <header>AI Chat</header>
    <div id="messages">
      <div class="empty">Start a conversation.</div>
    </div>
    <form id="chatForm">
      <textarea id="input" placeholder="Message Bedrock..." rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>

<script>
let conversationId = null;

const conversationsEl = document.getElementById("conversations");
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chatForm");
const input = document.getElementById("input");
const send = document.getElementById("send");

function clearMessages() {
  messagesEl.innerHTML = '<div class="empty">Start a conversation.</div>';
}

function addMessage(role, content) {
  const empty = messagesEl.querySelector(".empty");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "message " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = content;

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadConversations() {
  const res = await fetch("/api/conversations");
  const data = await res.json();

  conversationsEl.innerHTML = "";
  for (const c of data) {
    const button = document.createElement("button");
    button.className = "conv" + (c.id === conversationId ? " active" : "");
    button.textContent = c.title;
    button.onclick = () => loadConversation(c.id);
    conversationsEl.appendChild(button);
  }
}

async function loadConversation(id) {
  conversationId = id;
  const res = await fetch(`/api/conversations/${id}/messages`);
  const data = await res.json();

  clearMessages();
  for (const m of data) addMessage(m.role, m.content);
  await loadConversations();
}

document.getElementById("newChat").onclick = () => {
  conversationId = null;
  clearMessages();
  input.focus();
  loadConversations();
};

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const message = input.value.trim();
  if (!message || send.disabled) return;

  addMessage("user", message);
  input.value = "";
  send.disabled = true;
  send.textContent = "...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        conversation_id: conversationId,
        message
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Request failed");
    }

    conversationId = data.conversation_id;
    addMessage("assistant", data.reply);
    await loadConversations();
  } catch (err) {
    addMessage("assistant", "Error: " + err.message);
  } finally {
    send.disabled = false;
    send.textContent = "Send";
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

loadConversations();
</script>
</body>
</html>
